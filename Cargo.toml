[workspace]
resolver = "3"
members = ["crates/core", "crates/rinstall", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Yosuke Abe"]
publish = false

[workspace.dependencies]
rok-core = { path = "crates/core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = { version = "1.1.6", features = ["preserve_order"] }
toml_edit = "0.25.15"
ureq = "3.4.2"
flate2 = "1.1.10"
serde_json = "1.0.151"
pubgrub = "0.4.0"
tempfile = "3.27.0"
